<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>save</title>
<script>
  try {
    var t = localStorage.getItem('save-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);

    --bg: #F4F2F9;
    --surface: #FFFFFF;
    --ink: #221B3A;
    --muted: #6E6788;
    --line: #E4E0EF;
    --accent: #6D4AFF;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(109, 74, 255, .12);
    --danger: #C7304D;
    --g0: #6D4AFF;
    --g1: #EE5F3B;
    --g2: #0C9A88;
    --g3: #D69308;
    --g4: #D6336C;
    --g5: #1E7FE0;
    --shadow: 0 1px 2px rgba(34, 27, 58, .05), 0 14px 30px -18px rgba(34, 27, 58, .22);
    --scrim: rgba(20, 12, 40, .42);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141020;
      --surface: #1E182E;
      --ink: #EFEBFA;
      --muted: #9C94B8;
      --line: #2F2745;
      --accent: #9D86FF;
      --accent-ink: #141020;
      --accent-soft: rgba(157, 134, 255, .2);
      --danger: #FF7B92;
      --g0: #9D86FF;
      --g1: #FF8A65;
      --g2: #36D0BB;
      --g3: #F5B94A;
      --g4: #FF6FA5;
      --g5: #5CB0FF;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.7);
      --scrim: rgba(0, 0, 0, .6);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141020;
    --surface: #1E182E;
    --ink: #EFEBFA;
    --muted: #9C94B8;
    --line: #2F2745;
    --accent: #9D86FF;
    --accent-ink: #141020;
    --accent-soft: rgba(157, 134, 255, .2);
    --danger: #FF7B92;
    --g0: #9D86FF;
    --g1: #FF8A65;
    --g2: #36D0BB;
    --g3: #F5B94A;
    --g4: #FF6FA5;
    --g5: #5CB0FF;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 14px 30px -18px rgba(0,0,0,.7);
    --scrim: rgba(0, 0, 0, .6);
  }

  html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Tahoma, "Noto Sans Arabic", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    padding: 18px 16px 160px;
    transition: background .25s ease, color .25s ease;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
  svg { display: block; }

  .app { max-width: 560px; margin: 0 auto; }

  /* header */
  .top { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 20px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .logo { width: 40px; height: 40px; flex: none; }
  .wordmark { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.035em; line-height: 1; }
  .theme {
    width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center;
    background: var(--surface); border: 1px solid var(--line); color: var(--ink);
    transition: transform .15s ease;
  }
  .theme:active { transform: scale(.92) rotate(-12deg); }
  .theme svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .theme .sun { display: none; }
  .theme.is-dark .sun { display: block; }
  .theme.is-dark .moon { display: none; }

  /* summary */
  .summary { padding: 4px 2px 20px; }
  .sum-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .sum-main { font-size: 1.9rem; font-weight: 500; line-height: 1.25; letter-spacing: -0.01em; }
  .sum-sub { color: var(--muted); font-size: .92rem; margin-top: 2px; }
  .date { color: var(--muted); font-size: .85rem; font-weight: 300; white-space: nowrap; padding-bottom: 4px; }
  .stack { display: flex; height: 9px; border-radius: 99px; overflow: hidden; background: var(--line); margin-top: 14px; }
  .stack span { display: block; height: 100%; background: var(--gc); border-inline-end: 2px solid var(--bg); min-width: 4px; }

  /* list */
  #goals { list-style: none; padding: 0; }
  .c0 { --gc: var(--g0); } .c1 { --gc: var(--g1); } .c2 { --gc: var(--g2); }
  .c3 { --gc: var(--g3); } .c4 { --gc: var(--g4); } .c5 { --gc: var(--g5); }
  .ci { --gc: var(--muted); }

  .goal {
    background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
    margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow);
  }
  .goal-toggle { display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; text-align: start; }
  .ring {
    position: relative; flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center; transition: background .35s ease;
  }
  .ring .r { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); transition: opacity .2s; }
  .ring .track { fill: none; stroke: var(--line); stroke-width: 4.5; }
  .ring .prog { fill: none; stroke: var(--gc); stroke-width: 4.5; stroke-linecap: round; stroke-dasharray: 113.1; stroke-dashoffset: 113.1; transition: stroke-dashoffset .55s ease; }
  .ring-num { font-size: .68rem; font-weight: 500; }
  .ring-check { display: none; width: 21px; height: 21px; fill: none; stroke: var(--surface); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
  .goal.complete .ring { background: var(--gc); }
  .goal.complete .ring .r { opacity: 0; }
  .goal.complete .ring-num { display: none; }
  .goal.complete .ring-check { display: block; }
  .ring.pop { animation: pop .45s ease; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.18); } 100% { transform: scale(1); } }

  .goal-info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .goal-title { font-weight: 600; font-size: 1.05rem; line-height: 1.4; overflow-wrap: anywhere; }
  .goal-meta { color: var(--muted); font-size: .82rem; line-height: 1.4; }
  .chev { flex: none; width: 20px; height: 20px; stroke: var(--muted); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; transition: transform .25s ease; }
  .goal.open .chev { transform: rotate(180deg); }

  .goal-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease; }
  .goal.open .goal-body { grid-template-rows: 1fr; }
  .goal-inner { overflow: hidden; min-height: 0; }

  .tasks { list-style: none; padding: 0; }
  .task { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--line); }
  .check {
    flex: none; width: 28px; height: 28px; border-radius: 9px; border: 2px solid var(--muted);
    display: grid; place-items: center; transition: background .18s, border-color .18s, transform .12s;
  }
  .check:active { transform: scale(.88); }
  .check svg { width: 15px; height: 15px; stroke: var(--surface); stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 20; stroke-dashoffset: 20; transition: stroke-dashoffset .22s ease .05s; }
  .task.done .check { background: var(--gc); border-color: var(--gc); }
  .task.done .check svg { stroke-dashoffset: 0; }

  .label { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .txt {
    background-image: linear-gradient(currentColor, currentColor);
    background-repeat: no-repeat; background-position: right 58%; background-size: 0% 2px;
    transition: background-size .3s ease, color .3s ease;
  }
  .task.done .txt { color: var(--muted); background-size: 100% 2px; }
  .edit-input { width: 100%; background: var(--bg); border: 1.5px solid var(--gc); border-radius: 8px; padding: 6px 10px; font-size: 1rem; }
  .edit-input:focus { outline: none; }

  /* مهمة مستقلة: صف واحد بمربع اختيار */
  .task.solo {
    --gc: var(--accent);
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    margin-bottom: 10px; padding: 9px 12px 9px 10px; box-shadow: var(--shadow);
  }

  /* مهام يومية */
  .task.daily { --gc: var(--g2); }
  .streak {
    flex: none; display: flex; align-items: center; gap: 3px;
    padding: 2px 9px 2px 8px; border-radius: 99px;
    background: rgba(238, 95, 59, .14);
    background: color-mix(in srgb, var(--g1) 16%, transparent);
    font-size: .8rem; font-weight: 600;
  }
  .streak svg { width: 14px; height: 14px; fill: var(--g1); stroke: none; }
  .tab .ico { position: relative; }
  .badge {
    position: absolute; top: -3px; inset-inline-end: 6px;
    min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px;
    background: var(--accent); color: var(--accent-ink);
    font-size: .68rem; font-weight: 700; line-height: 17px; text-align: center;
    border: 2px solid var(--surface); box-sizing: content-box;
  }
  .badge[hidden] { display: none; }

  .icon { flex: none; width: 36px; height: 36px; border-radius: 10px; color: var(--muted); display: grid; place-items: center; transition: background .15s, color .15s; }
  .icon:hover { background: var(--bg); color: var(--ink); }
  .icon.del:hover { color: var(--danger); }
  .icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon.sm { width: 32px; height: 32px; }
  .icon.sm svg { width: 17px; height: 17px; }

  /* صف واحد مدمج: إضافة مهمة + تعديل + حذف */
  .task-add { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 12px; border-top: 1px solid var(--line); }
  .task-add:focus-within { box-shadow: inset 0 -2px 0 var(--gc); }
  .task-add input { flex: 1; min-width: 0; background: transparent; border: 0; padding: 6px 0; font-size: 1rem; }
  .task-add input:focus { outline: none; }
  .task-add input::placeholder { color: var(--muted); }
  .add-btn { flex: none; width: 32px; height: 32px; border-radius: 10px; background: var(--gc); display: grid; place-items: center; transition: transform .12s; }
  .add-btn:active { transform: scale(.9); }
  .add-btn svg { width: 16px; height: 16px; stroke: var(--surface); stroke-width: 2.6; fill: none; stroke-linecap: round; }
  .sep { flex: none; width: 1px; height: 20px; background: var(--line); margin-inline: 4px; }

  .rename { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid var(--line); background: var(--bg); }
  .rename input { flex: 1; min-width: 0; background: var(--surface); border: 1.5px solid var(--gc); border-radius: 10px; padding: 6px 12px; font-size: 1rem; }
  .rename input:focus { outline: none; }
  .rename button { background: var(--gc); color: var(--surface); border-radius: 10px; padding: 0 16px; font-weight: 500; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; border: 1.5px dashed var(--line); border-radius: 22px; list-style: none; }
  .empty strong { display: block; color: var(--ink); font-weight: 500; font-size: 1.05rem; margin-bottom: 4px; }

  /* bottom dock: nav + add button */
  .dock { position: fixed; inset-inline: 0; bottom: 0; margin-inline: auto; max-width: 560px; z-index: 20; }
  .nav {
    display: flex; gap: 4px;
    background: var(--surface); border-top: 1px solid var(--line);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -10px 30px -20px rgba(34, 27, 58, .35);
  }
  @media (min-width: 600px) { .nav { border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; } }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: .76rem; font-weight: 500; padding: 2px 0; }
  .tab .ico { display: grid; place-items: center; width: 60px; height: 32px; border-radius: 99px; transition: background .2s, color .2s; }
  .tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .tab[aria-pressed="true"] { color: var(--accent); }
  .tab[aria-pressed="true"] .ico { background: var(--accent-soft); }

  .fab {
    position: absolute; inset-inline-start: 16px; bottom: calc(100% + 14px);
    width: 58px; height: 58px; border-radius: 20px;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center;
    box-shadow: 0 10px 24px -8px var(--accent);
    transition: transform .15s ease;
  }
  .fab:active { transform: scale(.92); }
  .fab svg { width: 26px; height: 26px; stroke: currentColor; stroke-width: 2.4; fill: none; stroke-linecap: round; }

  /* add sheet */
  .backdrop { position: fixed; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .25s ease; z-index: 30; }
  .backdrop.show { opacity: 1; pointer-events: auto; }
  .sheet {
    position: fixed; inset-inline: 0; bottom: var(--kb, 0px); margin-inline: auto; max-width: 560px; z-index: 40;
    background: var(--surface); border-radius: 26px 26px 0 0;
    padding: 12px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -20px 50px -20px rgba(0, 0, 0, .4);
    transform: translateY(105%); visibility: hidden;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .3s;
  }
  .sheet.show { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2, .8, .2, 1), visibility 0s; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; }
  .sheet-head h2 { font-size: 1.15rem; font-weight: 600; }
  .sheet .close { width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; color: var(--muted); }
  .sheet .close:hover { background: var(--bg); }
  .sheet .close svg { width: 20px; height: 20px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; }
  .seg { display: flex; background: var(--bg); border-radius: 14px; padding: 4px; gap: 4px; margin: 12px 0; }
  .seg button { flex: 1; padding: 9px; border-radius: 11px; color: var(--muted); font-weight: 500; transition: background .15s, color .15s; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .field-input, .sheet select {
    width: 100%; background: var(--bg); border: 1.5px solid transparent; border-radius: 14px;
    padding: 13px 14px; font-size: 1.05rem;
  }
  .field-input:focus, .sheet select:focus { outline: none; border-color: var(--accent); }
  .field-input::placeholder { color: var(--muted); }
  .parent { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
  .parent[hidden] { display: none; }
  .parent span { color: var(--muted); font-size: .92rem; white-space: nowrap; }
  .hint { color: var(--muted); font-size: .85rem; margin: 10px 2px 0; min-height: 1.4em; }
  .primary { width: 100%; margin-top: 12px; background: var(--accent); color: var(--accent-ink); border-radius: 14px; padding: 14px; font-weight: 600; transition: transform .12s; }
  .primary:active { transform: scale(.98); }

  .toast {
    position: fixed; inset-inline: 16px; bottom: calc(148px + env(safe-area-inset-bottom, 0px)); margin-inline: auto; max-width: 360px; z-index: 50;
    background: var(--ink); color: var(--bg); border-radius: 14px; padding: 10px 10px 10px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: var(--shadow);
    transform: translateY(40px); opacity: 0; transition: transform .25s ease, opacity .25s ease; pointer-events: none;
  }
  .toast.show { transform: none; opacity: 1; pointer-events: auto; }
  .toast button { color: var(--bg); font-weight: 600; text-decoration: underline; padding: 4px 10px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#6D4AFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="save">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 40 40" role="img" aria-label="شعار save">
        <rect width="40" height="40" rx="12" fill="var(--accent)"/>
        <path d="M13 8.5H27Q28.5 8.5 28.5 10V31.5L20 25.8L11.5 31.5V10Q11.5 8.5 13 8.5Z" fill="var(--accent-ink)"/>
        <path d="M15.6 17.6L18.9 20.9L24.4 14.8" fill="none" stroke="var(--accent)" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wordmark" dir="ltr">save</span>
    </div>
    <button class="theme" id="themeBtn" type="button" aria-label="تبديل المظهر">
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </header>

  <section class="summary" aria-label="ملخص التقدم">
    <div class="sum-row">
      <div>
        <p class="sum-main" id="sumMain"></p>
        <p class="sum-sub" id="sumSub"></p>
      </div>
      <p class="date" id="date"></p>
    </div>
    <div class="stack" id="stack" role="img" aria-label="توزيع المهام المكتملة"></div>
  </section>

  <ul id="goals"></ul>
</div>

<div class="dock">
  <button class="fab" id="fab" type="button" aria-label="إضافة هدف أو مهمة">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <nav class="nav" aria-label="التصفية">
    <button class="tab" data-filter="active" aria-pressed="true">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg></span>جارية
    </button>
    <button class="tab" data-filter="done" aria-pressed="false">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M8.5 12.3l2.5 2.5 4.5-5"/></svg></span>مكتملة
    </button>
    <button class="tab" data-filter="all" aria-pressed="false">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg></span>الكل
    </button>
    <button class="tab" data-filter="daily" aria-pressed="false">
      <span class="ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2.5l3 3-3 3"/><path d="M4 11.5v-1.5a4.5 4.5 0 0 1 4.5-4.5H20"/><path d="M7 21.5l-3-3 3-3"/><path d="M20 12.5V14a4.5 4.5 0 0 1-4.5 4.5H4"/></svg><span class="badge" id="dailyBadge" hidden></span></span>يومية
    </button>
  </nav>
</div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true" inert>
  <div class="sheet-head">
    <h2 id="sheetTitle">إضافة جديدة</h2>
    <button class="close" id="sheetClose" type="button" aria-label="إغلاق"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="seg" role="group" aria-label="نوع العنصر">
    <button type="button" data-type="goal" aria-pressed="true">هدف كبير</button>
    <button type="button" data-type="task" aria-pressed="false">مهمة</button>
    <button type="button" data-type="daily" aria-pressed="false">يومية</button>
  </div>
  <form id="sheetForm" autocomplete="off">
    <input class="field-input" id="sheetInput" type="text" maxlength="200" aria-label="النص">
    <label class="parent" id="parentWrap" hidden>
      <span>داخل هدف</span>
      <select id="parentSelect"></select>
    </label>
    <p class="hint" id="sheetHint"></p>
    <button class="primary" id="sheetSubmit" type="submit">إضافة</button>
  </form>
</section>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span id="toastText">تم الحذف</span>
  <button type="button" id="undo">تراجع</button>
</div>

<script>
(function () {
  var KEY = 'save-app-v1';
  var OLD_KEY = 'todo-tasks-v1';
  var THEME_KEY = 'save-theme';
  var COLORS = 6;
  var CIRC = 113.1;
  var state = { goals: [], tasks: [], daily: [], filter: 'active' };
  var renderedDay = '';
  var lastDeleted = null;
  var undoTimer = null;
  var nf = new Intl.NumberFormat('ar-EG');
  var root = document.documentElement;

  var goalsEl = document.getElementById('goals');
  var stackEl = document.getElementById('stack');
  var sumMain = document.getElementById('sumMain');
  var sumSub = document.getElementById('sumSub');
  var toast = document.getElementById('toast');
  var toastText = document.getElementById('toastText');
  var themeBtn = document.getElementById('themeBtn');

  var sheet = document.getElementById('sheet');
  var backdrop = document.getElementById('backdrop');
  var sheetForm = document.getElementById('sheetForm');
  var sheetInput = document.getElementById('sheetInput');
  var sheetHint = document.getElementById('sheetHint');
  var sheetSubmit = document.getElementById('sheetSubmit');
  var parentWrap = document.getElementById('parentWrap');
  var parentSelect = document.getElementById('parentSelect');
  var sheetType = 'goal';
  var lastFocus = null;

  var ICON_FLAME = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5c.9 3.3 5.5 5.6 5.5 10.3A5.5 5.5 0 0 1 12 18.3a5.5 5.5 0 0 1-5.5-5.5c0-2 .9-3.4 1.9-4.4.3 1.4 1 2.2 1.9 2.4C9.6 8 10.4 5 12 2.5z"/></svg>';
  var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var ICON_EDIT = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>';
  var ICON_DEL = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6.5 7l1 13h9l1-13"/></svg>';

  function updateDate() {
    try {
      document.getElementById('date').textContent =
        new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' });
    } catch (e) {}
  }
  updateDate();

  /* ---------- أيام ومهام يومية ---------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function dayKey(d) {
    d = d || new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function isDoneToday(t) { return t.days.indexOf(dayKey()) >= 0; }
  function streakOf(t) {
    var set = {};
    t.days.forEach(function (k) { set[k] = 1; });
    var d = new Date();
    if (!set[dayKey(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (set[dayKey(d)] && n < 1000) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }

  /* ---------- keyboard-aware sheet ---------- */
  if (window.visualViewport) {
    var vv = window.visualViewport;
    var updateKb = function () {
      var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
      root.style.setProperty('--kb', kb + 'px');
    };
    vv.addEventListener('resize', updateKb);
    vv.addEventListener('scroll', updateKb);
  }

  /* ---------- theme ---------- */
  var mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function isDark() {
    var t = root.getAttribute('data-theme');
    if (t === 'dark') return true;
    if (t === 'light') return false;
    return !!(mq && mq.matches);
  }
  function syncThemeBtn() {
    var d = isDark();
    themeBtn.classList.toggle('is-dark', d);
    themeBtn.setAttribute('aria-label', d ? 'التبديل إلى المظهر الفاتح' : 'التبديل إلى المظهر الداكن');
  }
  themeBtn.addEventListener('click', function () {
    var next = isDark() ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    syncThemeBtn();
  });
  if (mq && mq.addEventListener) mq.addEventListener('change', syncThemeBtn);
  syncThemeBtn();

  /* ---------- data ---------- */
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function createdOf(x) {
    if (x.created) return x.created;
    var id = String(x.id);
    var n = parseInt(id.slice(0, Math.max(0, id.length - 5)), 36);
    return isFinite(n) ? n : 0;
  }
  function cleanTasks(arr) {
    return (Array.isArray(arr) ? arr : [])
      .filter(function (t) { return t && typeof t.text === 'string' && t.text.trim(); })
      .map(function (t) {
        var o = { id: String(t.id || uid()), text: t.text, done: !!t.done };
        if (t.created) o.created = t.created;
        return o;
      });
  }
  function cleanDaily(arr) {
    return (Array.isArray(arr) ? arr : [])
      .filter(function (t) { return t && typeof t.text === 'string' && t.text.trim(); })
      .map(function (t) {
        var days = (Array.isArray(t.days) ? t.days : [])
          .filter(function (k) { return typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k); });
        var o = { id: String(t.id || uid()), text: t.text, days: days.slice(-400) };
        if (t.created) o.created = t.created;
        return o;
      });
  }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var p = JSON.parse(raw);
        if (p && Array.isArray(p.goals)) {
          state.goals = p.goals
            .filter(function (g) { return g && typeof g.title === 'string'; })
            .map(function (g) {
              var o = {
                id: String(g.id || uid()),
                title: g.title,
                color: (((g.color | 0) % COLORS) + COLORS) % COLORS,
                open: g.open !== false,
                tasks: cleanTasks(g.tasks)
              };
              if (g.created) o.created = g.created;
              return o;
            });
          // المهام المستقلة (وتوافق مع النسخة السابقة التي كانت تحفظها داخل inbox)
          state.tasks = cleanTasks(p.tasks || (p.inbox && p.inbox.tasks));
          state.daily = cleanDaily(p.daily);
          return;
        }
      }
    } catch (e) {}
    try {
      var old = localStorage.getItem(OLD_KEY);
      if (old) {
        state.tasks = cleanTasks(JSON.parse(old));
        if (state.tasks.length) save();
      }
    } catch (e) {}
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify({ goals: state.goals, tasks: state.tasks, daily: state.daily })); } catch (e) {}
  }

  function doneCount(g) { return g.tasks.filter(function (t) { return t.done; }).length; }
  function isComplete(g) { return g.tasks.length > 0 && doneCount(g) === g.tasks.length; }
  function goalMatches(g) {
    if (state.filter === 'all') return true;
    return state.filter === 'done' ? isComplete(g) : !isComplete(g);
  }
  function taskVisible(t) {
    if (state.filter === 'all') return true;
    return state.filter === 'done' ? t.done : !t.done;
  }
  function findGoal(id) {
    for (var i = 0; i < state.goals.length; i++) if (state.goals[i].id === id) return state.goals[i];
    return null;
  }
  function taskIndex(arr, id) {
    for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return i;
    return -1;
  }
  function pickColor() {
    var counts = [];
    for (var i = 0; i < COLORS; i++) counts.push(0);
    state.goals.forEach(function (g) { counts[g.color]++; });
    var best = 0;
    for (var j = 1; j < COLORS; j++) if (counts[j] < counts[best]) best = j;
    return best;
  }

  /* ---------- summary ---------- */
  function updateBadge() {
    var left = state.daily.filter(function (t) { return !isDoneToday(t); }).length;
    var b = document.getElementById('dailyBadge');
    b.textContent = nf.format(left);
    b.hidden = left === 0;
  }

  function updateSummary() {
    updateBadge();
    if (state.filter === 'daily') {
      var dTotal = state.daily.length;
      var dDone = state.daily.filter(isDoneToday).length;
      sumMain.textContent = dTotal ? nf.format(dDone) + ' من ' + nf.format(dTotal) + ' اليوم' : 'لا توجد مهام يومية';
      sumSub.textContent = dTotal
        ? (dDone === dTotal ? 'أنجزت كل مهام اليوم' : 'تتجدد كل يوم عند منتصف الليل')
        : 'أضف عادة تكررها كل يوم';
      stackEl.innerHTML = '';
      if (dDone) {
        var ds = document.createElement('span');
        ds.className = 'c2';
        ds.style.width = (dDone / dTotal * 100) + '%';
        stackEl.appendChild(ds);
      }
      return;
    }
    var groups = state.goals.map(function (g) { return { color: g.color, tasks: g.tasks }; });
    groups.push({ color: 'i', tasks: state.tasks });
    var total = 0, done = 0, complete = 0;
    groups.forEach(function (g) {
      total += g.tasks.length;
      done += g.tasks.filter(function (t) { return t.done; }).length;
    });
    state.goals.forEach(function (g) { if (isComplete(g)) complete++; });
    sumMain.textContent = total
      ? nf.format(done) + ' من ' + nf.format(total) + (total === 1 ? ' مهمة' : ' مهام')
      : 'لا توجد مهام بعد';
    sumSub.textContent = state.goals.length
      ? 'أهداف مكتملة: ' + nf.format(complete) + ' من ' + nf.format(state.goals.length)
      : (total ? 'لا توجد أهداف بعد' : 'ابدأ بإضافة هدف أو مهمة');
    stackEl.innerHTML = '';
    if (total) {
      groups.forEach(function (g) {
        var d = g.tasks.filter(function (t) { return t.done; }).length;
        if (!d) return;
        var s = document.createElement('span');
        s.className = 'c' + g.color;
        s.style.width = (d / total * 100) + '%';
        stackEl.appendChild(s);
      });
    }
  }

  /* ---------- builders ---------- */
  function buildTask(task) {
    var li = document.createElement('li');
    li.className = 'task' + (task.done ? ' done' : '');
    li.dataset.id = task.id;

    var chk = document.createElement('button');
    chk.type = 'button';
    chk.className = 'check';
    chk.dataset.act = 'toggle-task';
    chk.setAttribute('role', 'checkbox');
    chk.setAttribute('aria-checked', task.done ? 'true' : 'false');
    chk.setAttribute('aria-label', 'إكمال المهمة');
    chk.innerHTML = ICON_CHECK;

    var label = document.createElement('span');
    label.className = 'label';
    var txt = document.createElement('span');
    txt.className = 'txt';
    txt.textContent = task.text;
    label.appendChild(txt);

    var edit = document.createElement('button');
    edit.type = 'button';
    edit.className = 'icon';
    edit.dataset.act = 'edit-task';
    edit.setAttribute('aria-label', 'تعديل المهمة');
    edit.innerHTML = ICON_EDIT;

    var del = document.createElement('button');
    del.type = 'button';
    del.className = 'icon del';
    del.dataset.act = 'delete-task';
    del.setAttribute('aria-label', 'حذف المهمة');
    del.innerHTML = ICON_DEL;

    li.appendChild(chk); li.appendChild(label); li.appendChild(edit); li.appendChild(del);
    return li;
  }

  function buildSolo(task) {
    var li = buildTask(task);
    li.classList.add('solo');
    return li;
  }

  function updateDailyRow(li, task) {
    var done = isDoneToday(task);
    li.classList.toggle('done', done);
    li.querySelector('.check').setAttribute('aria-checked', done ? 'true' : 'false');
    var n = streakOf(task);
    var chip = li.querySelector('.streak');
    if (n >= 2) {
      if (!chip) {
        chip = document.createElement('span');
        chip.className = 'streak';
        chip.setAttribute('role', 'img');
        chip.innerHTML = ICON_FLAME + '<span class="n"></span>';
        li.insertBefore(chip, li.querySelector('[data-act="edit-task"]'));
      }
      chip.querySelector('.n').textContent = nf.format(n);
      chip.setAttribute('aria-label', 'أيام متتالية: ' + nf.format(n));
    } else if (chip) {
      chip.remove();
    }
  }

  function buildDaily(task) {
    var li = buildTask({ id: task.id, text: task.text, done: isDoneToday(task) });
    li.classList.add('solo', 'daily');
    updateDailyRow(li, task);
    return li;
  }

  function updateGoalUI(el, goal, animate) {
    var total = goal.tasks.length;
    var done = doneCount(goal);
    var pct = total ? Math.round(done / total * 100) : 0;
    var complete = total > 0 && done === total;
    el.querySelector('.prog').style.strokeDashoffset = (CIRC * (1 - pct / 100)).toFixed(2);
    el.querySelector('.ring-num').textContent = nf.format(pct) + '٪';
    el.querySelector('.goal-meta').textContent = total
      ? nf.format(done) + ' من ' + nf.format(total) + (total === 1 ? ' مهمة' : ' مهام')
      : 'لا توجد مهام بعد';
    var was = el.classList.contains('complete');
    el.classList.toggle('complete', complete);
    if (animate && complete && !was) {
      var ring = el.querySelector('.ring');
      ring.classList.remove('pop');
      void ring.offsetWidth;
      ring.classList.add('pop');
    }
  }

  function setOpen(el, goal, open) {
    goal.open = open;
    el.classList.toggle('open', open);
    el.querySelector('.goal-toggle').setAttribute('aria-expanded', open ? 'true' : 'false');
    el.querySelector('.goal-inner').toggleAttribute('inert', !open);
  }

  function buildGoal(goal) {
    var li = document.createElement('li');
    li.className = 'goal c' + goal.color + (goal.open ? ' open' : '');
    li.dataset.id = goal.id;
    li.innerHTML =
      '<button class="goal-toggle" type="button" data-act="toggle-goal" aria-expanded="' + (goal.open ? 'true' : 'false') + '">' +
        '<span class="ring">' +
          '<svg class="r" viewBox="0 0 46 46" aria-hidden="true"><circle class="track" cx="23" cy="23" r="18"/><circle class="prog" cx="23" cy="23" r="18"/></svg>' +
          '<span class="ring-num"></span>' +
          '<svg class="ring-check" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' +
        '</span>' +
        '<span class="goal-info"><span class="goal-title"></span><span class="goal-meta"></span></span>' +
        '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' +
      '</button>' +
      '<div class="goal-body"><div class="goal-inner">' +
        '<ul class="tasks"></ul>' +
        '<form class="task-add" autocomplete="off">' +
          '<input type="text" maxlength="200" placeholder="أضف مهمة" aria-label="مهمة جديدة">' +
          '<button class="add-btn" type="submit" aria-label="إضافة مهمة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>' +
          '<span class="sep"></span>' +
          '<button class="icon sm" type="button" data-act="edit-goal" aria-label="تعديل اسم الهدف">' + ICON_EDIT + '</button>' +
          '<button class="icon sm del" type="button" data-act="delete-goal" aria-label="حذف الهدف">' + ICON_DEL + '</button>' +
        '</form>' +
      '</div></div>';
    li.querySelector('.goal-title').textContent = goal.title;
    var ul = li.querySelector('.tasks');
    goal.tasks.forEach(function (t) { ul.appendChild(buildTask(t)); });
    li.querySelector('.goal-inner').toggleAttribute('inert', !goal.open);
    updateGoalUI(li, goal, false);
    return li;
  }

  function emptyMessage() {
    if (!state.goals.length && !state.tasks.length) return ['ابدأ من هنا', 'اضغط زر + لإضافة هدف كبير أو مهمة.'];
    if (state.filter === 'active') return ['لا توجد عناصر جارية', 'أنجزت كل شيء حتى الآن.'];
    if (state.filter === 'done') return ['لا توجد عناصر مكتملة', 'أكمل مهمة أو هدفًا لتظهر هنا.'];
    return ['لا توجد عناصر', 'اضغط زر + لإضافة هدف أو مهمة.'];
  }

  function render() {
    goalsEl.innerHTML = '';
    renderedDay = dayKey();
    if (state.filter === 'daily') {
      if (!state.daily.length) {
        var dl = document.createElement('li');
        dl.className = 'empty';
        var ds = document.createElement('strong');
        ds.textContent = 'لا توجد مهام يومية';
        dl.appendChild(ds);
        dl.appendChild(document.createTextNode('أضف عادة تكررها كل يوم، مثل شرب الماء أو المشي.'));
        goalsEl.appendChild(dl);
      } else {
        state.daily.slice()
          .sort(function (a, b) { return createdOf(a) - createdOf(b); })
          .forEach(function (t) { goalsEl.appendChild(buildDaily(t)); });
      }
      updateSummary();
      return;
    }
    var items = [];
    state.goals.forEach(function (g) {
      if (goalMatches(g)) items.push({ kind: 'goal', obj: g, t: createdOf(g) });
    });
    state.tasks.forEach(function (t) {
      if (taskVisible(t)) items.push({ kind: 'task', obj: t, t: createdOf(t) });
    });
    items.sort(function (a, b) { return b.t - a.t; });

    if (!items.length) {
      var li = document.createElement('li');
      li.className = 'empty';
      var m = emptyMessage();
      var s = document.createElement('strong');
      s.textContent = m[0];
      li.appendChild(s);
      li.appendChild(document.createTextNode(m[1]));
      goalsEl.appendChild(li);
    } else {
      items.forEach(function (it) {
        goalsEl.appendChild(it.kind === 'goal' ? buildGoal(it.obj) : buildSolo(it.obj));
      });
    }
    updateSummary();
  }

  function scrollToItem(id) {
    var el = goalsEl.querySelector('[data-id="' + id + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  /* ---------- toast ---------- */
  function showToast(msg) {
    toastText.textContent = msg;
    toast.classList.add('show');
    clearTimeout(undoTimer);
    undoTimer = setTimeout(function () { toast.classList.remove('show'); lastDeleted = null; }, 5000);
  }

  document.getElementById('undo').addEventListener('click', function () {
    if (!lastDeleted) return;
    if (lastDeleted.type === 'goal') {
      state.goals.splice(Math.min(lastDeleted.index, state.goals.length), 0, lastDeleted.goal);
    } else if (lastDeleted.type === 'daily') {
      state.daily.splice(Math.min(lastDeleted.index, state.daily.length), 0, lastDeleted.task);
    } else if (lastDeleted.type === 'solo') {
      state.tasks.splice(Math.min(lastDeleted.index, state.tasks.length), 0, lastDeleted.task);
    } else {
      var g = findGoal(lastDeleted.goalId);
      if (g) g.tasks.splice(Math.min(lastDeleted.index, g.tasks.length), 0, lastDeleted.task);
    }
    lastDeleted = null;
    toast.classList.remove('show');
    clearTimeout(undoTimer);
    save();
    render();
  });

  /* ---------- editing ---------- */
  function startEditTask(taskEl, task) {
    var label = taskEl.querySelector('.label');
    var field = document.createElement('input');
    field.className = 'edit-input';
    field.type = 'text';
    field.maxLength = 200;
    field.value = task.text;
    field.setAttribute('aria-label', 'تعديل نص المهمة');
    label.innerHTML = '';
    label.appendChild(field);
    field.focus();
    field.setSelectionRange(field.value.length, field.value.length);
    var finished = false;
    function finish(commit) {
      if (finished) return;
      finished = true;
      var v = field.value.trim();
      if (commit && v) { task.text = v; save(); }
      label.innerHTML = '';
      var txt = document.createElement('span');
      txt.className = 'txt';
      txt.textContent = task.text;
      label.appendChild(txt);
    }
    field.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      else if (e.key === 'Escape') { finish(false); }
    });
    field.addEventListener('blur', function () { finish(true); });
  }

  function startRenameGoal(goalEl, goal) {
    if (!goal.open) setOpen(goalEl, goal, true);
    var inner = goalEl.querySelector('.goal-inner');
    var existing = inner.querySelector('.rename');
    if (existing) { existing.querySelector('input').focus(); return; }
    var f = document.createElement('form');
    f.className = 'rename';
    f.autocomplete = 'off';
    f.innerHTML = '<input type="text" maxlength="120" aria-label="اسم الهدف"><button type="submit">حفظ</button>';
    var input = f.querySelector('input');
    input.value = goal.title;
    inner.insertBefore(f, inner.firstChild);
    input.focus();
    input.select();
  }

  /* ---------- list events ---------- */
  goalsEl.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.dataset.act;

    // مهمة يومية
    var dailyEl = btn.closest('.task.daily');
    if (dailyEl) {
      var di = taskIndex(state.daily, dailyEl.dataset.id);
      if (di < 0) return;
      var dtask = state.daily[di];
      if (act === 'toggle-task') {
        var k = dayKey();
        var at = dtask.days.indexOf(k);
        if (at >= 0) dtask.days.splice(at, 1);
        else { dtask.days.push(k); if (dtask.days.length > 400) dtask.days = dtask.days.slice(-400); }
        save();
        updateDailyRow(dailyEl, dtask);
        updateSummary();
      } else if (act === 'edit-task') {
        startEditTask(dailyEl, dtask);
      } else if (act === 'delete-task') {
        state.daily.splice(di, 1);
        lastDeleted = { type: 'daily', task: dtask, index: di };
        dailyEl.remove();
        save();
        if (!goalsEl.children.length) render(); else updateSummary();
        showToast('تم حذف المهمة اليومية');
      }
      return;
    }

    // مهمة مستقلة
    var soloEl = btn.closest('.task.solo');
    if (soloEl) {
      var si = taskIndex(state.tasks, soloEl.dataset.id);
      if (si < 0) return;
      var stask = state.tasks[si];
      if (act === 'toggle-task') {
        stask.done = !stask.done;
        soloEl.classList.toggle('done', stask.done);
        btn.setAttribute('aria-checked', stask.done ? 'true' : 'false');
        save();
        updateSummary();
        if (state.filter !== 'all') {
          setTimeout(function () {
            if (soloEl.isConnected && !taskVisible(stask)) soloEl.remove();
            if (!goalsEl.children.length) render();
          }, 700);
        }
      } else if (act === 'edit-task') {
        startEditTask(soloEl, stask);
      } else if (act === 'delete-task') {
        state.tasks.splice(si, 1);
        lastDeleted = { type: 'solo', task: stask, index: si };
        soloEl.remove();
        save();
        if (!goalsEl.children.length) render(); else updateSummary();
        showToast('تم حذف المهمة');
      }
      return;
    }

    // هدف ومهامه
    var goalEl = btn.closest('.goal');
    if (!goalEl) return;
    var goal = findGoal(goalEl.dataset.id);
    if (!goal) return;
    var taskEl = btn.closest('.task');
    var ti = taskEl ? taskIndex(goal.tasks, taskEl.dataset.id) : -1;

    if (act === 'toggle-goal') {
      setOpen(goalEl, goal, !goal.open);
      save();
    } else if (act === 'toggle-task' && ti >= 0) {
      var task = goal.tasks[ti];
      task.done = !task.done;
      taskEl.classList.toggle('done', task.done);
      btn.setAttribute('aria-checked', task.done ? 'true' : 'false');
      save();
      updateGoalUI(goalEl, goal, true);
      updateSummary();
      if (state.filter !== 'all') {
        setTimeout(function () {
          if (goalEl.isConnected && !goalMatches(goal)) goalEl.remove();
          if (!goalsEl.children.length) render();
        }, 700);
      }
    } else if (act === 'edit-task' && ti >= 0) {
      startEditTask(taskEl, goal.tasks[ti]);
    } else if (act === 'delete-task' && ti >= 0) {
      var removed = goal.tasks.splice(ti, 1)[0];
      lastDeleted = { type: 'task', goalId: goal.id, task: removed, index: ti };
      taskEl.remove();
      save();
      updateGoalUI(goalEl, goal, false);
      updateSummary();
      showToast('تم حذف المهمة');
    } else if (act === 'edit-goal') {
      startRenameGoal(goalEl, goal);
    } else if (act === 'delete-goal') {
      var gi = state.goals.indexOf(goal);
      state.goals.splice(gi, 1);
      lastDeleted = { type: 'goal', goal: goal, index: gi };
      goalEl.remove();
      save();
      if (!goalsEl.children.length) render(); else updateSummary();
      showToast('تم حذف الهدف');
    }
  });

  goalsEl.addEventListener('submit', function (e) {
    e.preventDefault();
    var form = e.target;
    var goalEl = form.closest('.goal');
    if (!goalEl) return;
    var goal = findGoal(goalEl.dataset.id);
    if (!goal) return;
    var input = form.querySelector('input');
    var v = input.value.trim();

    if (form.classList.contains('task-add')) {
      if (!v) { input.focus(); return; }
      var task = { id: uid(), text: v, done: false, created: Date.now() };
      goal.tasks.push(task);
      goalEl.querySelector('.tasks').appendChild(buildTask(task));
      input.value = '';
      save();
      updateGoalUI(goalEl, goal, false);
      updateSummary();
      input.focus();
    } else if (form.classList.contains('rename')) {
      if (v) {
        goal.title = v;
        goalEl.querySelector('.goal-title').textContent = v;
        save();
      }
      form.remove();
    }
  });

  goalsEl.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && e.target.closest('.rename')) e.target.closest('.rename').remove();
  });

  /* ---------- bottom nav ---------- */
  function syncNav() {
    document.querySelectorAll('.tab').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.filter === state.filter ? 'true' : 'false');
    });
  }
  function setFilter(f) {
    state.filter = f;
    syncNav();
    render();
  }
  document.querySelectorAll('.tab').forEach(function (b) {
    b.addEventListener('click', function () {
      setFilter(b.dataset.filter);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  });

  /* ---------- add sheet ---------- */
  function fillParents(selected) {
    parentSelect.innerHTML = '';
    parentSelect.add(new Option('بدون هدف', 'none'));
    state.goals.forEach(function (g) { parentSelect.add(new Option(g.title, g.id)); });
    parentSelect.value = selected || 'none';
    if (parentSelect.value !== (selected || 'none')) parentSelect.value = 'none';
  }
  function setType(t, parent) {
    sheetType = t;
    document.querySelectorAll('.seg button').forEach(function (b) {
      b.setAttribute('aria-pressed', b.dataset.type === t ? 'true' : 'false');
    });
    parentWrap.hidden = t !== 'task';
    if (t === 'task') fillParents(parent);
    var copy = {
      goal: ['إضافة الهدف', 'مثال: تعلّم الإنجليزية', 'الهدف الكبير يجمع تحته مهامك الصغيرة.'],
      task: ['إضافة المهمة', 'اكتب المهمة', 'اختر هدفًا للمهمة، أو اتركها بدون هدف.'],
      daily: ['إضافة مهمة يومية', 'مثال: شرب ٨ أكواب ماء', 'تتجدد كل يوم وتبدأ غير مكتملة.']
    }[t];
    sheetSubmit.textContent = copy[0];
    sheetInput.placeholder = copy[1];
    sheetHint.textContent = copy[2];
  }
  function openSheet(type) {
    lastFocus = document.activeElement;
    setType(type || 'goal');
    sheet.removeAttribute('inert');
    sheet.setAttribute('aria-hidden', 'false');
    sheet.classList.add('show');
    backdrop.classList.add('show');
    setTimeout(function () { sheetInput.focus(); }, 60);
  }
  function closeSheet() {
    sheet.classList.remove('show');
    backdrop.classList.remove('show');
    sheet.setAttribute('inert', '');
    sheet.setAttribute('aria-hidden', 'true');
    sheetInput.value = '';
    sheetInput.blur();
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }

  document.getElementById('fab').addEventListener('click', function () { openSheet(state.filter === 'daily' ? 'daily' : 'goal'); });
  document.getElementById('sheetClose').addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && sheet.classList.contains('show')) closeSheet();
  });
  document.querySelectorAll('.seg button').forEach(function (b) {
    b.addEventListener('click', function () {
      setType(b.dataset.type, parentSelect.value);
      sheetInput.focus();
    });
  });

  sheetForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var v = sheetInput.value.trim();
    if (!v) { sheetInput.focus(); return; }
    if (sheetType === 'daily') {
      var dt = { id: uid(), text: v, days: [], created: Date.now() };
      state.daily.push(dt);
      state.filter = 'daily';
      syncNav();
      save();
      render();
      closeSheet();
      scrollToItem(dt.id);
      return;
    }
    if (state.filter === 'done' || state.filter === 'daily') { state.filter = 'active'; syncNav(); }

    if (sheetType === 'goal') {
      var goal = { id: uid(), title: v, color: pickColor(), open: true, tasks: [], created: Date.now() };
      state.goals.unshift(goal);
      save();
      render();
      scrollToItem(goal.id);
      sheetInput.value = '';
      setType('task', goal.id);
      sheetHint.textContent = 'تم إنشاء الهدف. أضف أول مهمة له، أو أغلق النافذة.';
      sheetInput.focus();
    } else {
      var task = { id: uid(), text: v, done: false, created: Date.now() };
      var target = parentSelect.value === 'none' ? null : findGoal(parentSelect.value);
      if (target) {
        target.tasks.push(task);
        target.open = true;
      } else {
        state.tasks.push(task);
      }
      save();
      render();
      closeSheet();
      scrollToItem(target ? target.id : task.id);
    }
  });

  function checkDay() {
    if (dayKey() !== renderedDay) { updateDate(); render(); }
  }
  setInterval(checkDay, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) checkDay(); });
  window.addEventListener('focus', checkDay);
  window.addEventListener('pageshow', checkDay);

  load();
  render();
})();
</script>
<script>
  if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
